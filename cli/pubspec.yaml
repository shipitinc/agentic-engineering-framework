name: framework_cli
description: >-
  Phase 1 skeleton of the agentic engineering framework CLI. Provides the
  command shape (bootstrap, upgrade, status, doctor, version), the domain
  result model, centralized semantic exit-code mapping, and deterministic
  human/JSON output rendering. Bootstrap/upgrade/status/doctor are explicit
  NOT_IMPLEMENTED stubs that never mutate state and never report success.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

# Cross-platform support (Phase 7)
# "windows" and "linux" are optional; the CLI uses dart:io and Process
# arg lists for maximum compatibility. "macos" is the primary dev platform.
platforms:
  macos:
  linux:
  windows:

dependencies:
  args: ^2.5.0
  crypto: ^3.0.0
  mason: ^0.1.0
  yaml: ^3.1.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
