name: CI Framework CLI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    defaults:
      run:
        working-directory: cli

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.5'

      - name: Install dependencies
        run: dart pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed bin/ lib/ test/runner_test.dart test/exit_mapping_test.dart test/human_output_test.dart test/json_output_test.dart test/no_mutation_test.dart test/bootstrap_regression_test.dart test/manifest/

      - name: Analyze
        run: dart analyze

      - name: Run tests (unit only)
        run: dart test --timeout=120s test/runner_test.dart test/exit_mapping_test.dart test/human_output_test.dart test/json_output_test.dart test/no_mutation_test.dart test/bootstrap_regression_test.dart test/manifest/

      - name: Compile executable
        run: dart compile exe bin/framework.dart -o framework_cli

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: framework-cli-${{ matrix.os }}
          path: framework_cli